const loadImg=src=>new Promise((ok,ko)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=ko;im.src=src});
const sigOf=async src=>{const im=await loadImg(src),N=16,c=document.createElement("canvas");c.width=c.height=N;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(im,0,0,N,N);const d=x.getImageData(0,0,N,N).data,g=[],h=new Array(64).fill(0);for(let i=0;i<d.length;i+=4){g.push(.299*d[i]+.587*d[i+1]+.114*d[i+2]);h[(d[i]>>6)*16+(d[i+1]>>6)*4+(d[i+2]>>6)]++}const m=g.reduce((a,b)=>a+b,0)/g.length,gn=g.map(v=>v-m),n=Math.sqrt(gn.reduce((a,b)=>a+b*b,0))||1;return{g:gn.map(v=>v/n),h:h.map(v=>v/g.length)}};
