<html lang="fr"><head><meta charset="utf-8">

<style>

.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 0}.chip{white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.pr{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #7b2ff71a}
.pr .im{aspect-ratio:1;display:grid;place-items:center;font-size:3.4rem;background:#f3ecff}.pr img{width:100%;height:100%;object-fit:cover}
.pr div.t{padding:8px 10px;font-size:.85rem}.pr .pc{color:var(--p);font-weight:800}.pr button{margin:0 10px 10px;width:calc(100% - 20px);border:0;border-radius:99px;padding:8px;background:var(--g);color:#fff;font-weight:600}

.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #eee;font-size:.88rem}.row small{color:var(--mu)}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}.st div{background:var(--g);color:#fff;border-radius:14px;padding:14px;font-size:.85rem}.st b{display:block;font-size:1.6rem}
.tag{background:#f3ecff;color:var(--v);border-radius:99px;padding:1px 8px;font-size:.72rem}
.rules{list-style:none;padding:0;margin:10px 0 0;font-size:.86rem}.rules li{padding:2px 0;font-weight:600}.rules .bad{color:#d12a4a}.rules .ok{color:#16a34a}.rules .idle{color:var(--mu);font-weight:400}.btn:disabled{opacity:.5;cursor:not-allowed}.pw{position:relative}.pw input{padding-right:46px}.pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:1.2rem;cursor:pointer}
.h2{margin:16px 0 8px;font-size:1.15rem}.mu{color:var(--mu)}.cg,.dg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.cg{grid-template-columns:repeat(4,1fr)}}.cc{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-height:110px}.cc span{font-size:1.8rem}.cc small{opacity:.7}.dc{background:linear-gradient(135deg,#0f2a6b,#1c4fb8);color:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}.dc b{font-size:1.1rem}.wp{background:#fff;color:#1d2b53;border-radius:8px;padding:6px 8px;font-size:.78rem;font-weight:600}.bd{align-self:flex-start;border-radius:99px;padding:3px 10px;font-size:.75rem;font-weight:700;background:#ffffff33}.bd.on{background:#16a34a}.mini{border:1.5px solid #d8cdf0;background:#fff;border-radius:99px;padding:6px 10px;font-size:.78rem;cursor:pointer}.mini.on{background:var(--g);color:#fff;border-color:transparent}.bt{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.acc{width:100%;background:none;border:0;font-weight:800;font-size:1rem;display:flex;justify-content:space-between;cursor:pointer;color:var(--tx)}.sl{display:block;color:var(--v);font-size:.78rem;font-weight:600;cursor:pointer;margin-top:4px}.ov{position:fixed;inset:0;background:#0007;z-index:20}.dr{position:fixed;top:0;bottom:0;left:0;width:82%;max-width:340px;background:#fff;z-index:21;padding:16px 14px calc(16px + env(safe-area-inset-bottom));overflow-y:auto}.drh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:1.2rem}.mi{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;padding:12px 10px;border-radius:12px;font-size:.98rem;text-align:left;cursor:pointer;color:var(--tx)}.mi.on{background:#fff3c4;font-weight:700}
nav i{background:#ffd60a;color:#ee2a86;font-weight:800}.back{width:44px;height:44px;border-radius:50%;background:#ffd60a;color:#ee2a86;border:0;font-size:1.5rem;font-weight:900;cursor:pointer;margin:0 0 10px;box-shadow:0 2px 8px #0003}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#ff8a00;color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;z-index:60;box-shadow:0 4px 14px #0004}#slow{position:fixed;top:0;left:0;right:0;background:#c2570c;color:#fff;padding:10px;text-align:center;font-weight:700;z-index:70}#slow i,.ld i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin:0 2px;animation:bl 1s infinite}.ld{padding:38vh 20px 0;text-align:center;font-weight:700;color:#7b2ff7}.ld i{background:#7b2ff7}#slow i:nth-child(2),.ld i:nth-child(2){animation-delay:.2s}#slow i:nth-child(3),.ld i:nth-child(3){animation-delay:.4s}@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}.vh{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;padding:14px;border-radius:18px;font-weight:800;cursor:pointer;margin-top:12px}.vb{background:#111827;border-radius:99px;padding:3px 12px}.vt{background:#111827;color:#ff8a00;border-radius:50%;width:34px;height:34px;display:inline-grid;place-items:center;margin-left:8px}.vbody{background:#1f2540;color:#fff;border-radius:0 0 18px 18px;padding:12px}.vi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #fff2}.tl{cursor:pointer}
.ob{background:#fb7701;color:#fff;border:0;border-radius:99px;padding:12px 16px;font-weight:700;cursor:pointer}.pr .ob{background:#fb7701}.ob:disabled,.pr .ob:disabled{background:#bbb}.op{color:#fb7701;font-weight:800}.gc{background:#e6f6ec;color:#0a7a3d;border-radius:6px;padding:2px 8px;font-size:.75rem;font-weight:700}.tm{background:linear-gradient(135deg,#fb7701,#ff9d4d);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}.pr .im{position:relative}.oos{position:absolute;left:6px;top:6px;background:#c0262d;color:#fff;border-radius:6px;padding:2px 8px;font-size:.72rem;font-weight:700}
</style></head><body><div id="app"><div class="ld">🐢 Connexion lente ? Patientez, l'application charge <i></i><i></i><i></i></div></div>
<script type="module">
/* ====== À MODIFIER ====== */
const CFG={apiKey:"COLLE_ICI",authDomain:"",projectId:"",appId:""}; // config Firebase (console > Paramètres du projet)
const PAY={moncash:"509 0000 0000",natcash:"509 0000 0000",nom:"Nom du titulaire"}; // tes numéros de paiement
const ADMIN_EMAIL="samtracestore00@gmail.com"; // le compte créé avec cet email devient ADMIN
/* ======================== */

let fb={};
if(!DEMO){const V="10.12.2",B=`https://www.gstatic.com/firebasejs/${V}/`;
 const [a,au,f]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
 const app=a.initializeApp(CFG);fb={...au,...f,auth:au.getAuth(app),db:f.getFirestore(app)};}

/* ---- Logo (2 couleurs, petit sac, texte rose) ---- */
const LOGO=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><linearGradient id="y" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd60a"/><stop offset="1" stop-color="#ffc400"/></linearGradient></defs><rect width="120" height="120" rx="26" fill="url(#y)"/><text x="60" y="43" text-anchor="middle" font-family="Arial Black,Arial" font-size="35" font-weight="900" fill="#ee2a86">STS</text><text x="60" y="61" text-anchor="middle" font-family="Arial" font-size="13" font-weight="800" fill="#ee2a86">Marketplace</text><text x="60" y="73" text-anchor="middle" font-family="Arial" font-size="9" font-weight="700" fill="#ee2a86">Achats en ligne</text><path d="M53 94v-3a7 7 0 0 1 14 0v3" stroke="#ee2a86" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M50 94h20l3 14H47z" fill="#ee2a86"/></svg>`;
const ICON="data:image/svg+xml,"+encodeURIComponent(LOGO);
document.head.insertAdjacentHTML("beforeend",`<link rel="icon" href="${ICON}"><link rel="apple-touch-icon" href="icon-192-v2.png">`);
document.head.insertAdjacentHTML("beforeend",`<link rel="manifest" href="manifest.json">`);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

/* ---- Langues ---- */
const T={fr:{tag:"Achats en ligne",login:"Se connecter",create:"Créer un compte",name:"Nom complet",email:"Email",pw:"Mot de passe",type:"Type de compte",buyer:"Acheteur",supplier:"Fournisseur / Grossiste",seller:"Vendeur",company:"Entreprise",visitor:"Continuer comme visiteur",noacc:"Pas de compte ? Créer un compte",hasacc:"Déjà un compte ? Se connecter",home:"Accueil",cart:"Panier",sell:"Vendre",admin:"Admin",acc:"Compte",search:"Rechercher un article…",add:"Ajouter au panier",empty:"Votre panier est vide. Ajoutez un article depuis l'accueil.",total:"Total",order:"Commander",done:"Commande envoyée !",need:"Créez un compte pour commander.",newp:"Nouvel article",ptitle:"Nom de l'article",price:"Prix (HTG)",photo:"Photo",cat:"Catégorie",pub:"Publier",mine:"Mes articles",out:"Se déconnecter",users:"Inscrits",vis:"Visiteurs",prods:"Articles",ords:"Commandes",all:"Tout",mode:"Mode",home2:"Maison",tech:"Tech",beauty:"Beauté",bad:"Email ou mot de passe incorrect.",exists:"Cet email existe déjà.",fill:"Remplissez tous les champs.",pwmin:"8 à 10 caractères",lang:"Langue",payhow:"Comment payer",r1:"8 à 10 caractères",r2:"Une seule lettre majuscule",r3:"Les autres lettres en minuscules",r4:"Au moins un chiffre",r5:"Au moins un symbole",r6:"Les deux mots de passe sont identiques",pw2:"Confirmer le mot de passe",pwbad:"Le mot de passe ne respecte pas toutes les règles.",paytxt:"Envoie le montant total par MonCash ou NatCash à ce numéro, puis clique sur Commander.",holder:"Titulaire",noitem:"Aucun article pour le moment.",pubd:"Article publié !"},
ht:{tag:"Achte sou entènèt",login:"Konekte",create:"Kreye yon kont",name:"Non konplè",email:"Imèl",pw:"Modpas",type:"Kalite kont",buyer:"Achtè",supplier:"Founisè / Gwosis",seller:"Vandè",company:"Konpayi",visitor:"Kontinye kòm vizitè",noacc:"Ou pa gen kont ? Kreye yon kont",hasacc:"Ou gen yon kont deja ? Konekte",home:"Akèy",cart:"Panye",sell:"Vann",admin:"Admin",acc:"Kont",search:"Chèche yon atik…",add:"Mete nan panye",empty:"Panye w la vid. Ajoute yon atik depi nan Akèy.",total:"Total",order:"Pase kòmand",done:"Kòmand lan voye !",need:"Kreye yon kont pou w ka pase kòmand.",newp:"Nouvo atik",ptitle:"Non atik la",price:"Pri (HTG)",photo:"Foto",cat:"Kategori",pub:"Pibliye",mine:"Atik mwen yo",out:"Dekonekte",users:"Moun ki enskri",vis:"Vizitè",prods:"Atik",ords:"Kòmand",all:"Tout",mode:"Rad",home2:"Kay",tech:"Teknoloji",beauty:"Bote",bad:"Imèl oswa modpas la pa bon.",exists:"Imèl sa a deja egziste.",fill:"Ranpli tout chan yo.",pwmin:"8 a 10 karaktè",lang:"Lang",payhow:"Kijan pou w peye",r1:"8 a 10 karaktè",r2:"Yon sèl lèt majiskil",r3:"Lòt lèt yo an minisil",r4:"Omwen yon chif",r5:"Omwen yon senbòl",r6:"De modpas yo idantik",pw2:"Konfime modpas la",pwbad:"Modpas la pa respekte tout règ yo.",paytxt:"Voye montan total la pa MonCash oswa NatCash sou nimewo sa a, answit klike sou Pase kòmand.",holder:"Mèt kont",noitem:"Pa gen atik pou kounye a.",pubd:"Atik la pibliye !"}};
const CATS=["mode","home2","tech","beauty"];

/* ---- Données ---- */
const ls=c=>JSON.parse(localStorage["sts_"+c]||"[]");
const D={async del(c,id){if(DEMO){localStorage["sts_"+c]=JSON.stringify(ls(c).filter(x=>x.id!==id));return}await fb.deleteDoc(fb.doc(fb.db,c,id))},async put(c,id,o){if(DEMO){const a=ls(c).filter(x=>x.id!==id);a.push({...o,id});localStorage["sts_"+c]=JSON.stringify(a);return}await fb.setDoc(fb.doc(fb.db,c,id),o)},async list(c){if(DEMO)return ls(c);const s=await fb.getDocs(fb.collection(fb.db,c));return s.docs.map(d=>({id:d.id,...d.data()}))},
async add(c,o){o.t=Date.now();if(DEMO){o.id="x"+o.t+Math.random().toString(36).slice(2,6);const a=ls(c);a.push(o);localStorage["sts_"+c]=JSON.stringify(a);return o}const r=await fb.addDoc(fb.collection(fb.db,c),o);return{...o,id:r.id}}};
const role=(e,r)=>e.toLowerCase()===ADMIN_EMAIL.toLowerCase()?"admin":r;
async function signUp(n,e,p,r,lang,x={}){const u={name:n,email:e,role:role(e,r),lang,...x};
 if(DEMO){if(ls("users").some(x=>x.email===e))throw Error("exists");return await D.add("users",{...u,pw:p})}
 try{const c=await fb.createUserWithEmailAndPassword(fb.auth,e,p);await fb.setDoc(fb.doc(fb.db,"users",c.user.uid),{...u,t:Date.now()});return{...u,id:c.user.uid}}catch(x){throw Error(x.code==="auth/email-already-in-use"?"exists":"bad")}}
async function signIn(e,p){if(DEMO){const u=ls("users").find(x=>x.email===e&&x.pw===p);if(!u)throw Error("bad");return u}
 try{const c=await fb.signInWithEmailAndPassword(fb.auth,e,p);const d=await fb.getDoc(fb.doc(fb.db,"users",c.user.uid));return{...d.data(),id:c.user.uid}}catch{throw Error("bad")}}

/* ---- État ---- */
const S={revs:[],ords:[],opt:{},rv:{},pid:"",shops:[],kyc:[],f:{},cfg:{},menu:false,op:"",cid:0,store:"",soon:"",lang:localStorage.sts_lang||"fr",user:JSON.parse(localStorage.sts_user||"null"),tab:"home",cart:[],cat:"all",q:"",mode:"login",err:"",prods:[],adm:{},img:""};
const t=k=>T[S.lang][k]||k,$=s=>document.querySelector(s),v=id=>($("#"+id)?.value||"").trim();
const fmt=n=>Number(n).toLocaleString("fr-FR")+" HTG";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const save=()=>{localStorage.sts_lang=S.lang;S.user?localStorage.sts_user=JSON.stringify({...S.user,pw:undefined}):localStorage.removeItem("sts_user")};

async function load0(){S.prods=await D.list("products");S.cfg=(await D.list("settings")).find(x=>x.id==="main")||{};S.shops=await D.list("shops");S.revs=await D.list("reviews");S.ords=S.user&&S.user.role!=="visitor"?await D.list("orders"):[];if(S.user?.role==="admin")S.kyc=await D.list("kyc");
 
 if(S.user?.role==="admin"){const [u,vi,o]=await Promise.all([D.list("users"),D.list("visits"),D.list("orders")]);S.adm={u,vi,o}}render()}

/* ---- Vues ---- */
const RULES=[["r1",p=>p.length>=8&&p.length<=10],["r2",p=>(p.match(/\p{Lu}/gu)||[]).length===1],["r3",p=>/\p{Ll}/u.test(p)],["r4",p=>/\d/.test(p)],["r5",p=>/[^\p{L}\p{N}\s]/u.test(p)],["r6",(p,q)=>p.length>0&&p===q]];
const rulesHtml=(p="",q="")=>RULES.map(([k,f])=>{const idle=!p&&!q,ok=f(p,q);return`<li class="${idle?"idle":ok?"ok":"bad"}">${ok?"✓":"✗"} ${t(k)}</li>`}).join("");
const showErr=m=>{S.err=m;const e=document.querySelector(".err");if(e)e.textContent=m};
const langBtns=()=>`<div class="lang">${["ht","fr"].map(l=>`<button class="${S.lang===l?"on":""}" onclick="setLang('${l}')">${l==="ht"?"🇭🇹 Kreyòl":"🇫🇷 Français"}</button>`).join("")}</div>`;
function authView(){const c=S.mode==="create";
 return`<div class="auth"><img src="${ICON}" alt="STS"><h1>STS Marketplace</h1><p class="s">${t("tag")}</p>${langBtns()}
<div class="card"><h3>${c?t("create"):t("login")}</h3>
${c?`<label>${t("name")}</label><input id="n" autocomplete="name">`:""}
<label>${t("email")}</label><input id="e" type="email" placeholder="ton@email.com" autocomplete="email">
<label>${t("pw")}</label><div class="pw"><input id="p" type="password" placeholder="${t("pwmin")}" autocomplete="${c?"new-password":"current-password"}" ${c?'oninput="checkPw()"':""}><button type="button" class="eye" onclick="togglePw()">👁</button></div>${c?`<label>${t("pw2")}</label><input id="p2" type="password" oninput="checkPw()" autocomplete="new-password"><ul class="rules" id="rules">${rulesHtml()}</ul>`:""}
${c?`<label>${t("type")}</label><select id="r" onchange="togglePay()"><option value="buyer">${t("buyer")}</option><option value="seller">${t("seller")}</option><option value="supplier">${t("supplier")}</option><option value="company">${t("company")}</option></select><label>${L("Votre département","Depatman ou")}</label><select id="dp">${DEPTS.map(d=>`<option>${d}</option>`).join("")}</select>`:""}
<div class="err">${esc(S.err)}</div><button id="go" class="btn" ${c?"disabled":""} onclick="${c?"doSignUp()":"doSignIn()"}">${c?t("create"):t("login")}</button>
<button class="lnk" onclick="S.mode='${c?"login":"create"}';S.err='';render()">${c?t("hasacc"):t("noacc")}</button></div>
<button class="btn alt" onclick="goVisitor()">👀 ${t("visitor")}</button></div>`}
const header=()=>`<header><button class="lnk" style="margin:0;font-size:1.6rem" onclick="togMenu()">☰</button><img src="${ICON}" alt=""><b>STS Marketplace</b>${langBtns()}</header>`;
const nav=()=>{const u=S.user,tabs=[["home","🏠",t("home")],["cart","🛒",t("cart")]];
 if(["seller","company","supplier","admin"].includes(u.role))tabs.push(["sell","➕",t("sell")]);
 if(u.role==="admin")tabs.push(["admin","📊",t("admin")]);tabs.push(["acc","👤",t("acc")]);
 return`<nav>${tabs.map(([k,i,l])=>`<button class="${S.tab===k?"on":""}" onclick="S.tab='${k}';render()"><span>${i}</span>${l}${k==="cart"?`<i>${S.cart.length}</i>`:""}</button>`).join("")}</nav>`};
const card=p=>`<div class="pr"><div class="im">${p.img?`<img src="${p.img}" alt="">`:p.emo||"🛍️"}</div><div class="t">${esc(p.title)}<div class="pc">${fmt(p.price)}</div></div><button onclick="addCart('${p.id}')">${t("add")}</button></div>`;
function view(){const x=view2(),b=x!==null?x:view0();return S.tab==="home"?b:`<button class="back" onclick="S.tab='home';render()">←</button>`+b}
function view0(){const u=S.user;
 if(S.tab==="home"){const l=S.prods.filter(p=>(S.cat==="all"||p.cat===S.cat)&&p.title.toLowerCase().includes(S.q.toLowerCase()));
  return`<input id="q" value="${esc(S.q)}" placeholder="${t("search")}" oninput="S.q=this.value;render(true)"><div class="cats">${["all",...CATS].map(c=>`<button class="chip ${S.cat===c?"on":""}" onclick="S.cat='${c}';render()">${t(c)}</button>`).join("")}</div>
  <div class="grid">${l.map(card).join("")||`<p>${t("noitem")}</p>`}</div>`}

 const pmh=F.map(([k,f,h])=>`<label>${L(f,h)}</label><input id="pm_${k}" type="number" value="${esc(pm[k]||"")}">`).join("")+`<button class="btn" onclick="pmSave()">${L("Enregistrer les modifications","Anrejistre chanjman yo")}</button>`;
 const uc=abox("u","👥 "+t("users")+" ("+u.length+")",u.map(x=>`<div class="row" style="align-items:center"><span>${esc(x.name)}<br><small>${esc(x.email)}</small></span><span class="tag">${t(x.role==="admin"?"admin":x.role)}</span><button class="mini" onclick="delUser('${esc(x.id)}')">🗑</button></div>`).join("")||none(L("Aucun inscrit","Pa gen moun enskri")));
 const oc=abox("o","🧾 "+t("ords")+" ("+od.length+")",od.slice().reverse().map(x=>`<div class="row"><span>${esc(x.buyer)}<br><small>${x.n} × → ${esc(x.seller||"")}</small></span><b>${fmt(x.total)}</b></div>`).join("")||none(L("Aucune commande","Pa gen kòmand")));
 const vh=`<div class="vh" onclick="S.op=S.op==='v'?'':'v';render()"><span>🕒 ${L("Visiteur / Dernière visite","Vizitè / Dènye vizit")}</span><span><b class="vb">${vi.length}</b><b class="vt">${S.op==="v"?"▲":"▼"}</b></span></div>`;
 const vb=S.op==="v"?`<div class="vbody">${vi.length?`<button class="btn" style="background:#ec2f8a;margin:0 0 6px" onclick="delVisits()">🗑 ${L("Supprimer tout","Efase tout")} (${vi.length})</button>`:""}${vi.slice().reverse().map(x=>{const s=S.shops.find(y=>y.id===x.email);return`<div class="vi"><span>${s&&s.logo?`<img src="${s.logo}" style="width:48px;height:48px;border-radius:10px;object-fit:cover;vertical-align:middle"> `:"👀 "}<b>${esc(x.name||L("Visiteur","Vizitè"))}</b><br><small>${esc(x.role||"")} ${x.email?"· "+esc(x.email):""} · ${new Date(x.t).toLocaleString()}</small></span><button class="mini" onclick="delVisit('${esc(x.id)}')">🗑</button></div>`}).join("")||none(L("Aucune nouvelle visite. 🎉","Pa gen nouvo vizit. 🎉"))}</div>`:"";
 const st=S.cfg.store||{},msh=`<div style="display:flex;gap:12px;align-items:center">${logoPick()}<b>${L("Logo","Logo")}</b></div><label>${L("Nom de mon store","Non magazen mwen")}</label><input id="ms_n" value="${esc(st.name||"")}"><label>WhatsApp</label><input id="ms_w" inputmode="tel" value="${esc(st.whatsapp||"")}"><label>${L("Adresse","Adrès")}</label><input id="ms_a" value="${esc(st.addr||"")}"><label>${L("Description","Deskripsyon")}</label><textarea id="ms_d" rows="3" style="width:100%;padding:12px;border:1.5px solid #e2d9f3;border-radius:12px">${esc(st.desc||"")}</textarea><button class="btn" onclick="storeSave()">${L("Enregistrer","Anrejistre")}</button>`;
 return`<div class="st">${tile("u",u.length,t("users"))}${tile("v",vi.length,t("vis"))}${tile("p",S.prods.length,t("prods"))}${tile("o",od.length,t("ords"))}</div>`+abox("m",L("☰ Menu","☰ Meni"),menu)+adminCfg()+abox("pa",L("💳 Comptes de paiement STS","💳 Kont peman STS"),pa)+abox("pm",L("⚙️ Paramètres du paiement manuel","⚙️ Paramèt peman manyèl"),pmh)+abox("ms",L("🏠 Mon store STS","🏠 Magazen STS mwen"),msh)+uc+vh+vb+oc}
Object.assign(window,{
renCat(i){const n=prompt(L("Nouveau nom de la catégorie","Nouvo non kategori a"),cn(i));if(!n)return;const m={...(S.cfg.catName||{})};m[i]={...(m[i]||{}),[S.lang]:n};S.cfg={...S.cfg,catName:m};saveCfg()},
menuSet(k,on){const c={...S.cfg};if(k.startsWith("cat:"))c.menuCat={...(c.menuCat||{}),[k.slice(4)]:on};else c.menuOff={...(c.menuOff||{}),[k]:!on};S.cfg=c;saveCfg()},
payOn(k){const p={...(S.cfg.pay||{})};p[k]={...(p[k]||{}),on:!(p[k]||{}).on};S.cfg={...S.cfg,pay:p};saveCfg()},
paySave(k){const p={...(S.cfg.pay||{})},g=id=>document.getElementById(id).value.trim();p[k]={...(p[k]||{}),name:g("pa_n_"+k),num:g("pa_c_"+k),icon:(S.f||{})["pi_"+k]||(p[k]||{}).icon||""};S.cfg={...S.cfg,pay:p};saveCfg();toast(L("Enregistré","Anrejistre"))},
payDel(k){const p={...(S.cfg.pay||{})};delete p[k];S.cfg={...S.cfg,pay:p};saveCfg()},
pmSave(){const m={};for(const k of "abcde")m[k]=document.getElementById("pm_"+k).value.trim();S.cfg={...S.cfg,pm:m};saveCfg();toast(L("Enregistré","Anrejistre"))},
cp(x){navigator.clipboard&&navigator.clipboard.writeText(x).then(()=>toast(L("Copié","Kopye")))},
async delVisit(id){await D.del("visits",id);load()},
async delVisits(){if(!confirm(L("Supprimer toutes les visites ?","Efase tout vizit yo ?")))return;for(const x of (S.adm.vi||[]))await D.del("visits",x.id);load()}});
/* ---- Boutique Temu, détail article, avis ---- */
const logoPick=()=>{const u=S.user,l=u.role==="admin"?(S.cfg.store||{}).logo:((myShop()||{}).logo||u.logo);return`<label style="cursor:pointer;position:relative;display:inline-block">${logoEl(l,u.name,72)}<span style="position:absolute;right:-2px;bottom:-2px;background:#ffd60a;color:#ee2a86;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-weight:900">+</span><input type="file" accept="image/*" style="display:none" onchange="setLogo(this)"></label>`};
const reviewsBlock=e=>{const r=rate(e),u=S.user,ok=u&&u.role!=="visitor"&&S.ords.some(o=>o.buyer===u.email&&o.seller===e);
 return`<div class="card"><h3>⭐ ${L("Avis","Avi")} ${r.n?`<span class="op">${r.avg.toFixed(1)}</span> <small>(${r.n})</small>`:""}</h3>${r.list.slice().reverse().map(x=>`<div class="row" style="display:block"><b>${esc(x.name)}</b> <span class="op">${star(x.stars)}</span><br>${esc(x.text||"")}${(x.items||[]).length?`<br><small>🛒 ${L("Commandé","Kòmande")} : ${esc(x.items.join(", "))}</small>`:""}</div>`).join("")||`<p class="mu">${L("Aucun avis pour le moment.","Pa gen avi pou kounye a.")}</p>`}${ok?`<div class="bt">${[1,2,3,4,5].map(n=>`<button class="mini ${(S.rv.stars||0)>=n?"on":""}" onclick="S.rv.stars=${n};render(true)">★</button>`).join("")}</div><textarea rows="3" style="width:100%;padding:12px;border:1.5px solid #e2d9f3;border-radius:12px;margin-top:8px" placeholder="${L("Votre commentaire","Kòmantè ou")}" oninput="S.rv.text=this.value">${esc(S.rv.text||"")}</textarea><button class="ob" style="width:100%;margin-top:8px" onclick="sendReview('${esc(e)}')">${L("Publier l'avis","Pibliye avi a")}</button>`:`<p class="mu">${L("Commandez chez ce vendeur pour laisser un avis.","Kòmande kay vandè sa a pou kite yon avi.")}</p>`}</div>`};
const storePage=()=>{const e=S.store,sh=shopOf(e)||{name:""},r=rate(e),l=S.prods.filter(p=>vis(p)&&p.sellerEmail===e);
 return`<div class="tm"><div style="display:flex;gap:12px;align-items:center">${logoEl(sh.logo,sh.name,64)}<div><b style="font-size:1.2rem">🏠 ${esc(sh.name)}</b>${sh.verified?` <span class="gc">✔ ${L("Vérifié par STS Marketplace","Verifye pa STS Marketplace")}</span>`:""}<br>${star(r.avg)} ${r.avg?r.avg.toFixed(1):""} (${r.n})</div></div>${sh.desc?`<p style="margin:10px 0 0">${esc(sh.desc)}</p>`:""}<p style="margin:8px 0 0;font-size:.9rem">${sh.dept?"📍 "+esc(sh.dept):""}${sh.addr?" · "+esc(sh.addr):""}${sh.whatsapp?" · 📞 "+esc(sh.whatsapp):""}</p><div style="margin-top:8px">${wa(e,1)}</div></div><h3 class="h2">${L("Articles","Atik")} (${l.length})</h3><div class="grid">${l.map(pc2).join("")||`<p class="mu">${t("noitem")}</p>`}</div>${reviewsBlock(e)}`};
const prodPage=()=>{const p=S.prods.find(x=>x.id===S.pid);if(!p)return"";const o=S.opt||{},ch=(arr,k)=>`<div class="bt">${arr.map(c=>`<button class="mini ${o[k]===c?"on":""}" onclick="S.opt.${k}='${esc(c)}';render()">${esc(c)}</button>`).join("")}</div>`;
 return`<div class="card" style="padding:0;overflow:hidden">${p.img?`<img src="${p.img}" style="width:100%;max-height:340px;object-fit:cover">`:`<div class="im" style="aspect-ratio:1;font-size:5rem;display:grid;place-items:center">${(CT[p.cid]||["🛍️"])[0]}</div>`}<div style="padding:14px"><div class="op" style="font-size:1.5rem">${fmt(p.price)}</div><h3>${esc(p.title)}</h3><div style="margin:6px 0"><a class="sl" style="display:inline" onclick="openWa('${esc(p.sellerEmail)}')">${esc(p.seller)}</a> <span style="cursor:pointer;font-size:1.2rem" onclick="openStore('${esc(p.sellerEmail)}')">🏠</span></div>${p.out?`<span class="oos" style="position:static">${L("Rupture de stock","Pa gen stòk")}</span>`:""}${(p.colors||[]).length?`<b>${L("Couleur","Koulè")} : ${esc(o.color||"")}</b>${ch(p.colors,"color")}`:""}${(p.sizes||[]).length?`<b>${L("Taille","Gwosè")} : ${esc(o.size||"")}</b>${ch(p.sizes,"size")}`:""}<div class="row" style="border:0;align-items:center"><b>${L("Qté","Kantite")}</b><span><button class="mini" onclick="S.opt.qty=Math.max(1,(S.opt.qty||1)-1);render()">−</button> <b>${o.qty||1}</b> <button class="mini" onclick="S.opt.qty=(S.opt.qty||1)+1;render()">+</button></span></div><button class="ob" style="width:100%" ${p.out?"disabled":""} onclick="addOpt('${p.id}')">${p.out?L("Rupture de stock","Pa gen stòk"):L("Ajouter au panier","Mete nan panye")}</button></div></div>`+reviewsBlock(p.sellerEmail)};
Object.assign(window,{
openProd(id){S.pid=id;S.opt={qty:1};S.tab="prod";render()},
addOpt(id){const p=S.prods.find(x=>x.id===id),o=S.opt||{};if(!p||p.out)return;if((p.colors||[]).length&&!o.color)return toast(L("Choisissez une couleur","Chwazi yon koulè"));if((p.sizes||[]).length&&!o.size)return toast(L("Choisissez une taille","Chwazi yon gwosè"));S.cart.push({...p,color:o.color||"",size:o.size||"",qty:o.qty||1});toast(L("Article ajouté au panier","Atik ajoute nan panye"));render(true)},
openWa(e){const s=shopOf(e);if(s&&s.whatsapp)window.open("https://wa.me/"+String(s.whatsapp).replace(/\D/g,""),"_blank");else toast(L("Pas de numéro WhatsApp","Pa gen nimewo WhatsApp"))},
async togStock(id){const p=S.prods.find(x=>x.id===id);await D.put("products",id,{...p,out:!p.out});load()},
setLogo(i){const f=i.files[0];if(!f||!f.type.startsWith("image/"))return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=async()=>{const c=document.createElement("canvas"),q=Math.min(1,240/Math.max(im.width,im.height));c.width=im.width*q;c.height=im.height*q;c.getContext("2d").drawImage(im,0,0,c.width,c.height);const d=c.toDataURL("image/jpeg",.8),u=S.user;if(u.role==="admin"){S.cfg={...S.cfg,store:{...(S.cfg.store||{}),logo:d}};await saveCfg()}else{const sh=myShop();S.user={...u,logo:d};save();if(sh)await D.put("shops",sh.id,{...sh,logo:d});load()}};im.src=r.result};r.readAsDataURL(f)},
storeSave(){const g=id=>document.getElementById(id).value.trim();S.cfg={...S.cfg,store:{...(S.cfg.store||{}),name:g("ms_n"),whatsapp:g("ms_w"),addr:g("ms_a"),desc:g("ms_d")}};saveCfg();toast(L("Enregistré","Anrejistre"))},
async sendReview(e){const u=S.user,st=S.rv.stars;if(!st)return toast(L("Choisissez le nombre d'étoiles","Chwazi kantite zetwal yo"));const items=[].concat(...S.ords.filter(o=>o.buyer===u.email&&o.seller===e).map(o=>o.items||[]));await D.add("reviews",{seller:e,buyer:u.email,name:u.name,stars:st,text:(S.rv.text||"").trim(),items});S.rv={};load()}});
render();load();
</script></body></html>
